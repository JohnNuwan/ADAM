<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADAM-CHAT — Messagerie Sécurisée</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --bg-hover: #252540;
            --border: #2a2a40;
            --text-primary: #e0e0ff;
            --text-secondary: #8888aa;
            --text-muted: #555577;
            --accent: #00d4ff;
            --accent-glow: rgba(0,212,255,0.15);
            --success: #00ff88;
            --error: #ff4466;
            --msg-other: #1a1a2e;
            --msg-mine: #0d2b3e;
            --font-ui: 'Inter',sans-serif;
            --font-mono: 'JetBrains Mono',monospace;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font-ui);background:var(--bg-primary);color:var(--text-primary);height:100vh;overflow:hidden}
        #toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
        .toast{padding:12px 20px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;transform:translateX(20px);transition:all .3s;border:1px solid;backdrop-filter:blur(8px)}
        .toast.visible{opacity:1;transform:translateX(0)}
        .toast.success{background:rgba(0,255,136,0.1);border-color:var(--success);color:var(--success)}
        .toast.error{background:rgba(255,68,102,0.1);border-color:var(--error);color:var(--error)}
        .toast.info{background:rgba(0,212,255,0.1);border-color:var(--accent);color:var(--accent)}
        #auth-view{display:flex;align-items:center;justify-content:center;height:100vh;background:radial-gradient(ellipse at center,#0d0d20 0%,#0a0a0f 70%)}
        .auth-container{width:400px;padding:40px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden}
        .auth-container::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;height:3px;background:linear-gradient(90deg,var(--accent),var(--success),var(--accent));background-size:200% 100%;animation:shimmer 3s linear infinite}
        @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
        .auth-logo{text-align:center;margin-bottom:32px}
        .auth-logo h1{font-family:var(--font-mono);font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--success));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .auth-logo p{color:var(--text-secondary);font-size:14px;margin-top:8px}
        .auth-tabs{display:flex;gap:4px;background:var(--bg-tertiary);border-radius:8px;padding:4px;margin-bottom:24px}
        .auth-tab{flex:1;padding:8px;text-align:center;border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-ui);font-size:14px;font-weight:500;cursor:pointer;border-radius:6px;transition:all .2s}
        .auth-tab.active{background:var(--accent);color:#000;font-weight:600}
        .auth-form{display:none}.auth-form.active{display:block}
        .auth-form input{width:100%;padding:12px 16px;margin-bottom:12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:var(--font-ui);font-size:14px;outline:none}
        .auth-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
        .auth-form button{width:100%;padding:12px;margin-top:8px;background:linear-gradient(135deg,var(--accent),#00a0cc);border:none;border-radius:8px;color:#000;font-family:var(--font-ui);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
        .auth-form button:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--accent-glow)}
        #chat-view{display:none;height:100vh;flex-direction:row}
        .sidebar{width:300px;min-width:300px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        .sidebar-header h2{font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--accent)}
        .sidebar-header .actions button{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg-tertiary);color:var(--text-secondary);cursor:pointer;font-size:16px;transition:all .2s}
        .sidebar-header .actions button:hover{background:var(--bg-hover);color:var(--accent);border-color:var(--accent)}
        .sidebar-tabs{display:flex;padding:8px 16px;gap:4px}
        .sidebar-tab{flex:1;padding:6px;text-align:center;border:none;background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:12px;font-weight:500;cursor:pointer;border-radius:4px}
        .sidebar-tab.active{color:var(--accent);background:var(--accent-glow)}
        .sidebar-list{flex:1;overflow-y:auto;padding:4px 8px}
        .sidebar-list::-webkit-scrollbar{width:4px}.sidebar-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .channel-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;cursor:pointer;transition:all .2s;margin-bottom:2px}
        .channel-item:hover{background:var(--bg-hover)}
        .channel-item.active{background:var(--accent-glow);border-left:3px solid var(--accent)}
        .channel-icon{width:36px;height:36px;border-radius:8px;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:14px;flex-shrink:0}
        .channel-info{flex:1;min-width:0}
        .channel-name{font-size:14px;font-weight:600;color:var(--text-primary)}
        .channel-last{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg-primary)}
        .chat-header{padding:12px 20px;background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
        #channel-title{font-size:16px;font-weight:600}
        #channel-desc{font-size:12px;color:var(--text-muted)}
        #connection-status{font-family:var(--font-mono);font-size:11px}
        .status-connected{color:var(--success)}.status-disconnected{color:var(--error)}
        .logout-btn{padding:4px 12px;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text-secondary);font-family:var(--font-ui);font-size:12px;cursor:pointer}
        .logout-btn:hover{border-color:var(--error);color:var(--error)}
        .messages-container{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:4px}
        .messages-container::-webkit-scrollbar{width:4px}.messages-container::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .message{padding:8px 12px;border-radius:8px;max-width:80%;position:relative;animation:fadeIn .2s ease-out}
        @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
        .message:not(.mine){background:var(--msg-other);align-self:flex-start;border-bottom-left-radius:2px}
        .message.mine{background:var(--msg-mine);align-self:flex-end;border-bottom-right-radius:2px;border:1px solid rgba(0,212,255,0.15)}
        .msg-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px}
        .msg-author{font-weight:600;color:var(--accent)}
        .msg-time{color:var(--text-muted)}
        .msg-content{font-size:14px;line-height:1.5;word-wrap:break-word}
        .edited-badge{color:var(--warning);font-size:10px}
        #typing-indicator{padding:4px 20px;font-size:12px;color:var(--text-muted);font-style:italic;opacity:0;transition:opacity .3s;height:0}
        #typing-indicator.visible{opacity:1;height:auto;min-height:24px}
        .input-area{padding:12px 20px;background:var(--bg-secondary);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px}
        .input-area textarea{flex:1;padding:10px 16px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:var(--font-ui);font-size:14px;resize:none;outline:none;max-height:150px;line-height:1.4}
        .input-area textarea:focus{border-color:var(--accent)}
        .input-area button{width:40px;height:40px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--accent),#00a0cc);color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .input-area button:hover{transform:translateY(-1px);box-shadow:0 4px 15px var(--accent-glow)}
        .input-area .attach-btn{background:var(--bg-tertiary);color:var(--text-muted);font-size:16px;border:1px solid var(--border)}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000}
        .modal.visible{display:flex}
        .modal-content{width:400px;padding:24px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px}
        .modal-content h3{font-family:var(--font-mono);font-size:16px;margin-bottom:16px;color:var(--accent)}
        .modal-content input,.modal-content textarea{width:100%;padding:10px 14px;margin-bottom:12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:var(--font-ui);font-size:13px;outline:none}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
        .modal-actions button{padding:8px 16px;border:none;border-radius:6px;font-family:var(--font-ui);font-size:13px;font-weight:500;cursor:pointer}
        .modal-actions .btn-primary{background:var(--accent);color:#000}
        .modal-actions .btn-secondary{background:var(--bg-tertiary);color:var(--text-secondary)}
        .welcome-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);gap:12px}
        .welcome-state .big-icon{font-size:48px;opacity:0.5}
        .welcome-state h2{font-family:var(--font-mono);font-size:20px;color:var(--text-secondary)}
        .welcome-state .encryption-badge{margin-top:16px;padding:8px 16px;background:var(--accent-glow);border:1px solid rgba(0,212,255,0.3);border-radius:20px;color:var(--accent);font-size:12px;font-family:var(--font-mono)}
    </style>
</head>
<body>
<div id="toast-container"></div>

<div id="auth-view">
    <div class="auth-container">
        <div class="auth-logo">
            <div style="font-size:24px;margin-bottom:12px">🔐</div>
            <h1>ADAM-CHAT</h1>
            <p>Messagerie sécurisée de The Hive</p>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Connexion</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Inscription</button>
        </div>
        <div id="login-form" class="auth-form active">
            <input type="text" id="login-username" placeholder="Nom d'utilisateur">
            <input type="password" id="login-password" placeholder="Mot de passe">
            <button onclick="doLogin()">🚀 Se connecter</button>
        </div>
        <div id="register-form" class="auth-form">
            <input type="text" id="reg-username" placeholder="Nom d'utilisateur">
            <input type="password" id="reg-password" placeholder="Mot de passe (min 6)">
            <input type="password" id="reg-confirm" placeholder="Confirmer">
            <button onclick="doRegister()">🔐 Créer un compte</button>
        </div>
    </div>
</div>

<div id="chat-view">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>✦ ADAM-CHAT</h2>
            <div class="actions">
                <button onclick="showCreateChannel()" title="Nouveau canal">＋</button>
                <button onclick="handleLogout()" title="Déconnexion">⏻</button>
            </div>
        </div>
        <div class="sidebar-tabs">
            <button class="sidebar-tab active" onclick="switchSidebarTab('channels',this)">Canaux</button>
            <button class="sidebar-tab" onclick="switchSidebarTab('users',this)">Contacts</button>
        </div>
        <div id="channel-list" class="sidebar-list"></div>
        <div id="user-list" class="sidebar-list" style="display:none"></div>
    </div>
    <div class="chat-main">
        <div class="chat-header">
            <div>
                <div id="channel-title">Sélectionne un canal</div>
                <div id="channel-desc"></div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;font-size:12px">
                <span id="connection-status">🔴 Déconnecté</span>
                <button class="logout-btn" onclick="handleLogout()">Déconnexion</button>
            </div>
        </div>
        <div id="messages-container" class="messages-container">
            <div class="welcome-state">
                <div class="big-icon">💬</div>
                <h2>Bienvenue sur ADAM-CHAT</h2>
                <p>Sélectionne un canal pour discuter</p>
                <div class="encryption-badge">🔒 Chiffrement AES-256-GCM</div>
            </div>
        </div>
        <div id="typing-indicator"></div>
        <div class="input-area">
            <button class="attach-btn" onclick="triggerFileUpload()" title="Joindre">📎</button>
            <textarea id="message-input" placeholder="Message..." disabled></textarea>
            <button id="send-btn" onclick="sendMessage()" disabled>➤</button>
            <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(event)">
        </div>
    </div>
</div>

<div id="create-channel-modal" class="modal">
    <div class="modal-content">
        <h3>✦ Nouveau canal</h3>
        <input type="text" id="new-channel-name" placeholder="Nom du canal">
        <textarea id="new-channel-desc" placeholder="Description"></textarea>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="document.getElementById('create-channel-modal').classList.remove('visible')">Annuler</button>
            <button class="btn-primary" onclick="createChannel()">Créer</button>
        </div>
    </div>
</div>

<script src="/static/chat.js"></script>
<script>
function switchAuthTab(t){document.querySelectorAll('.auth-tab').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.auth-form').forEach(e=>e.classList.remove('active'));if(t==='login'){document.querySelector('.auth-tab:first-child').classList.add('active');document.getElementById('login-form').classList.add('active')}else{document.querySelector('.auth-tab:last-child').classList.add('active');document.getElementById('register-form').classList.add('active')}}
function doLogin(){const u=document.getElementById('login-username').value.trim(),p=document.getElementById('login-password').value;if(!u||!p)return showToast('Remplis tous les champs','error');handleLogin(u,p)}
function doRegister(){const u=document.getElementById('reg-username').value.trim(),p=document.getElementById('reg-password').value,c=document.getElementById('reg-confirm').value;if(!u||!p||!c)return showToast('Remplis tous les champs','error');if(p!==c)return showToast('Mots de passe différents','error');if(p.length<6)return showToast('Trop court (min 6)','error');handleRegister(u,p)}
function switchSidebarTab(t,b){document.querySelectorAll('.sidebar-tab').forEach(e=>e.classList.remove('active'));b.classList.add('active');document.getElementById('channel-list').style.display=t==='channels'?'block':'none';document.getElementById('user-list').style.display=t==='users'?'block':'none'}
document.addEventListener('DOMContentLoaded',()=>{['login-username','login-password'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()}));['reg-username','reg-password','reg-confirm'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()}))});
</script>
</body>
</html>
