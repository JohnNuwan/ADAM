# ADAM Docker Stack
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: adam-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: adam
      POSTGRES_USER: adam
      POSTGRES_PASSWORD: adam_secret_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adam -d adam"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-bus:
    build:
      context: ./bus
      dockerfile: Dockerfile
    container_name: adam-bus
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      POSTGRES_DSN: postgres://adam:adam_secret_2026@postgres:5432/adam?sslmode=disable
      HTTP_PORT: "8086"
    depends_on:
      postgres:
        condition: service_healthy

  adam-viz:
    build:
      context: ./agents/viz
      dockerfile: Dockerfile
    container_name: adam-viz
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      BUS_URL: http://go-bus:8086
    depends_on:
      - go-bus

  adam-chat:
    build:
      context: ./agents/chat
      dockerfile: Dockerfile
    container_name: adam-chat
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      BUS_URL: http://go-bus:8086
    depends_on:
      - go-bus

  graphify:
    image: python:3.12-slim
    container_name: adam-graphify
    restart: unless-stopped
    ports:
      - "8090:8090"
    command: >
      bash -c "
      pip install -q flask psycopg2-binary &&
      python /app/graphify_server.py
      "
    environment:
      PG_DSN: postgres://adam:adam_secret_2026@postgres:5432/adam?sslmode=disable
    volumes:
      - ./graphify_server.py:/app/graphify_server.py
      - /home/aza/eva-adam-v2/agents:/data/agents:ro
      - /home/aza/EVA_CORE/skills:/data/skills:ro
    depends_on:
      postgres:
        condition: service_healthy

  monitor:
    image: python:3.12-slim
    container_name: eva-monitor
    restart: unless-stopped
    ports:
      - "8091:8091"
    command: >
      bash -c "
      pip install -q flask &&
      python /app/eva_monitor.py
      "
    environment:
      VLLM_URL: http://192.168.1.5:8000
    volumes:
      - ./eva_monitor.py:/app/eva_monitor.py
      - /home/aza/eva-adam-v2/agents:/data/agents:ro
      - /home/aza/EVA_CORE/skills:/data/skills:ro
      - /home/aza/eva-adam-v2/EVA_DIRECTIVE.md:/home/aza/eva-adam-v2/EVA_DIRECTIVE.md:ro
    depends_on:
      go-bus:
        condition: service_started

  activity:
    image: python:3.12-slim
    container_name: eva-activity
    restart: unless-stopped
    ports:
      - "8092:8092"
    command: >
      bash -c "
      pip install -q flask &&
      python /app/eva_activity.py
      "
    environment:
      VLLM_URL: http://192.168.1.5:8000
    volumes:
      - ./eva_activity.py:/app/eva_activity.py
      - /home/aza/eva-adam-v2/agents:/data/agents:ro
      - /home/aza/EVA_CORE/skills:/data/skills:ro
    depends_on:
      go-bus:
        condition: service_started

  products:
    image: python:3.12-slim
    container_name: eva-products
    restart: unless-stopped
    ports:
      - "8093:8093"
    command: >
      bash -c "
      pip install -q flask &&
      python /app/eva_products.py
      "
    volumes:
      - ./eva_products.py:/app/eva_products.py
      - /home/aza/eva-adam-v2/agents/scribe/tools/landing_page.html:/app/landing_page.html:ro

volumes:
  pgdata:


