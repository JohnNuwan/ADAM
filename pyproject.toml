[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ADAM"
version = "2.0.0"
description = "Framework multi-agent ADAM — auto-evolution, agents specialises, self-heal"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-socketio>=5.0",
    "bcrypt>=4.0",
    "pyjwt>=2.0",
    "cryptography>=41.0",
]
